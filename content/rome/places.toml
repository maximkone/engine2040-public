# The settlements of the Rome chapter maps: a gazetteer slice of the Roman Empire
# under Hadrian, cut to the six chapter areas of docs/plan/rome.md section 3.
#
# Source: Diasito/urbesetorbis, `public/downloads/301023_AD130.csv` (7,891 settlements
# of the Roman Empire under Hadrian), BSD-2-Clause. Every row keeps the ids of the
# databases it can be checked against: Pleiades, the Barrington Atlas square, DARE
# and Wikidata. The licence and the sha256 of the file are in the provenance section
# below and in content/rome/PROVENANCE.md.
#
# The slice: every gazetteer row inside the box of a chapter area. Five areas keep
# every row of their box; the Rome box holds 29 rows in the gazetteer and the three
# of rank 5 or better are kept here, so the table stays small. The plan's second
# box for chapter IV, the Tapae pass, holds no row of the gazetteer and is left out.
#
# Units: a coordinate is micro-degrees (a millionth of a degree) written as signed
# integer text, because the table's numbers are unsigned and Hadrian's Wall lies
# west of Greenwich. `m_per_deg_lat` and the `m_per_deg_lon` of an area turn a
# coordinate into millimetres, so every distance the loader reads is an integer
# number of millimetres.
#
# Every entry names its source in `ref`. The loader refuses an entry with no `ref`,
# a place that names an area the table does not hold, and a place that lies
# outside the box of its area.

[units]
m_per_deg_lat = 111132
ref = "WGS84: the length of one degree of latitude at 45 degrees north is 111132 m"

