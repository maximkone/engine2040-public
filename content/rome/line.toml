# The battle line: one man's frontage and the gap between ranks. Lengths are Roman
# feet as the sources give them; the loader turns them into millimetres. Every entry
# that holds a number names its source in `ref` (docs/plan/rome.md section 5), and an
# entry without one is refused.
#
# The `codex.*` sections below are the machine proof of every number here: the passage
# that gives it, the spelling the source writes and the hash of that passage's text.
# The Rome loader reads the entries above only, so the proof lives in its own sections
# and never touches a number the game reads. `node tools/codex-check.mjs` reads the
# two public-domain sources and checks every row against the passage it names.

[units]
mm_per_ft = 296
ref = "rome.md section 5: 1 Roman foot about 0.296 m"

[line]
frontage_ft = 3
rank_gap_ft = 6
ref = "rome.md section 5, Vegetius 3.14 (frontage), 3.14-15 (rank gap)"

