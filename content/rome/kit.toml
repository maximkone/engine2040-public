# The kit of the period, and how sure we are of every piece of it.
#
# Every item says how sure we are: `attested` (an object was found and its date is
# fixed), `reconstructed` (built from texts and pictures), `contested` (scholars
# disagree) or `invented` (ours). Every item names its source in `ref`, which points
# at docs/plan/rome.md and the ancient source it names. An item that survives as an
# object carries a `found` section: the site, the year it was found and the date of
# the object. An open question about an item is a `reading` with its standing, so the
# codex card shows the debate instead of hiding it.
#
# The list is rome.md section 3 (the kit of the period) and the section 4.9 table (rare
# and contested kit). The loader refuses an item without a `certainty` or without a
# `ref`, and the refusal names the item's key.
#
# The section 3 items are the types of the period that rome.md lists for our years,
# so they are attested types. rome.md gives no separate find for them, so they carry
# no `found` section; the finds below are the ones rome.md states.

[kit.lorica]
certainty = "attested"
ref = "rome.md section 3, kit of the period: Corbridge-type lorica segmentata"

[kit.helmet]
certainty = "attested"
ref = "rome.md section 3, kit of the period: Imperial Gallic (Weisenau) helmet"

[kit.gladius]
certainty = "attested"
ref = "rome.md section 3, kit of the period: Pompeii gladius, blade 45-50 cm; Vegetius 1.12 for the thrust"

[kit.pilum]
