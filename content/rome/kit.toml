ref = "rome.md section 4.4: scutum of two glued plank layers, linen, then calfskin, an iron or bronze rim (Polybius 6.23)"

[kit.pugio]
certainty = "attested"
ref = "rome.md section 4.9: the Haltern inlaid pugio (early 1st c.) is outside our years, a codex card only"

[kit.pugio.found]
site = "Haltern"
object_date = "early 1st century AD"
ref = "rome.md section 4.9: Haltern inlaid pugio, early 1st c."

