[package]
name = "engine-playtest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# QA2 frame checks run RA1 offscreen captures on llvmpipe, opt-in so the
# headless default stays std-only (render `v1` is glam/image PNG-only).
[features]
capture = ["dep:engine-render"]
# NS31h2: the material gallery draws compiled records on a real device
# through render's `pipeline_for`; the default build stays GPU-free.
window = ["dep:engine-render", "engine-render/window", "dep:wgpu", "dep:pollster"]
# SPR4 live recorder: one real-model run over the door tools, written as a
# cassette. Network + provider key, so never on by default or in CI.
live = ["dep:serde_json", "engine-provider/tls"]

[dependencies]
# QA3 bout bots: the bot harness ticks the shipped pressure/guard trees.
engine-ai.workspace = true
# ARC8: the keypoint spine track steps `engine_arena::spine_step` (`spine` flag).
engine-arena = { workspace = true, features = ["spine"] }
# GP7 feel keypoints play the presentation feel (shake, hit-stop, framing) from combat.
engine-combat.workspace = true
# Keyed evidence seal for the a6/a7 writers: HMAC-SHA256 over the manifest
# under the operator key (`hmac` 0.12 + `sha2` 0.10, both MIT/Apache-2.0,
# pure Rust). Unconditional: this crate sits outside the headless default
# graph, so the workspace check stays green. Per-file digests reuse the
# engine-core FNV owner instead of local copies.
engine-core.workspace = true
# NS31h2: the gallery compiles shipped records and reads the pair report
# (`engine_material::compare`). Std-only, outside the headless default graph.
engine-material.workspace = true
hmac = "0.12"
sha2 = "0.10"
# EV1 eval harness drives mock/local/remote providers (std + serde_json).
engine-provider.workspace = true
# SPR4 live recorder decodes OpenRouter tool-call envelopes (feature `live`).
serde_json = { workspace = true, optional = true }
engine-spatial.workspace = true
engine-render = { workspace = true, optional = true, features = ["v1"] }
# NS31h2 window leg: the gallery holds a device and builds one pipeline per
# record through render's `pipeline_for`. Off unless `window` is on.
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# Look judge PNG decode (MIT/Apache-2.0): the same `image` 0.25 the render and
# assets crates already resolve, PNG codec only, so the lock gains no package.
image = { version = "0.25", default-features = false, features = ["png"] }

# SSIMULACRA2 v2.1, the look gate's second metric (BSD-2-Clause, LICENSE read
# live 2026-10-21, rust-av/ssimulacra2). default-features = false drops rayon:
# one pair at a time, so the pool buys nothing and the score stays in one
# thread. Pulls yuvxyb (MIT) plus v_frame, av-data and yuvxyb-math.
ssimulacra2 = { version = "0.5.1", default-features = false }

# SPR4 live recorder: one real-model cassette run, never built by default.
[[example]]
name = "spatial_llm_record"
required-features = ["live"]
