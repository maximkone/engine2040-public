[package]
name = "engine-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Server-authoritative arena match plus client prediction (default kinematic
# track; the arena `sim` physics track stays off - see session docs).
# Reconnect/desync heal runs through the observe supervisor (std-only).
engine-arena.workspace = true
engine-core.workspace = true
# BX9: the cut lane frames combat's `Cut` event and names its `JointId`
# without a second copy (`cuts.rs`), so the wire stays field-for-field.
engine-combat.workspace = true
engine-input.workspace = true
engine-observe.workspace = true
# ARC5: rejoin resim keeps spine checkpoints in canonical `Spine::snapshot`
# bytes and reads/writes them through the save rollback/persist envelopes.
engine-ecs.workspace = true
engine-save.workspace = true
# QUIC transport (optional; the headless default stays std-only).
quinn = { version = "0.11", optional = true }
# WebTransport server (optional): browsers join the dedicated server through
# it. It runs on its own tokio I/O thread; the tick loop never awaits.
wtransport = { version = "0.7", optional = true }
tokio = { workspace = true, optional = true, features = ["net", "sync", "time"] }
# WebSocket server (optional): the fallback leg for browsers whose network blocks UDP.
# Handshake only (no TLS, no connect helpers): wss is terminated in front of it.
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std", "sink"] }
# RC15: authenticated connect tokens (src/handshake.rs) seal with HMAC-SHA256,
# the same pure-Rust pair the evidence seal uses (`hmac` 0.12 + `sha2` 0.10,
# both MIT/Apache-2.0). Optional: the default graph, and the wasm bundle the
# web build ships, keep the development-only plain seal shape.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
# `--features quic` builds the quinn transport behind Transport.
quic = ["dep:quinn"]
# `--features webtransport` adds the WebTransport server beside QUIC: the
# same Transport trait and wire codec, plus the pinned-certificate helper.
webtransport = ["quic", "dep:wtransport", "dep:tokio"]
# `--features websocket` adds the WebSocket server beside QUIC: the same Transport
# trait and the same payload bytes, one binary message per frame.
websocket = ["quic", "dep:tokio-tungstenite", "dep:futures-util", "dep:tokio"]
# `--features crypto` authenticates every handshake seal with HMAC-SHA256
# (`handshake::seal_token` / `open_token` and the challenge/response seals).
# Off by default: the wasm bundle the web build ships stays small, and the
# default seal is the documented development-only fold.
crypto = ["dep:hmac", "dep:sha2"]

# The dedicated server a page plays a scripted duel against (WEB9/WEB12). It needs the
# WebSocket server, so a default build (std-only) never sees it.
[[bin]]
name = "net_serve"
path = "src/bin/net_serve.rs"
required-features = ["websocket"]

# Browser clients (WebSocket and WebTransport through the page's own APIs).
# Target-gated, so the native build never sees them; the wasm-bindgen glue is
# the one `engine-web` already links (Cargo.lock).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["BinaryType", "CloseEvent", "Event", "MessageEvent", "WebSocket"] }

[dev-dependencies]
engine-core = { workspace = true, features = ["test-util"] }
engine-physics = { workspace = true }
