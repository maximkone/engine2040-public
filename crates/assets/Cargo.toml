[package]
name = "engine-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# Headless default stays std-only (workspace-check.mjs enforces it): the
# identity registry rides the non-default `registry` feature until a consumer
# needs it (new crates sit behind features).
[features]
registry = ["engine-scene"]
# Import lane: real glTF + texture decoding, opt-in so headless stays std-only.
# It also covers skinned/skeleton/clip import into the anim contract
# (assets -> anim; anim never imports assets back).
import = ["dep:gltf", "dep:image", "dep:serde_json"]

[dependencies]
engine-core.workspace = true
engine-clock.workspace = true
engine-scene = { version = "0.1.0", path = "../scene", optional = true }
# The anim contract owns the clip and pose types every intake fills; it is
# std-only, so the BVH motion intake reads it in the default build.
engine-anim.workspace = true
# `extras`: morph target names ride in `mesh.extras.targetNames` (morph_import).
gltf = { workspace = true, optional = true, features = ["extras"] }
# QW10: PNG, JPEG and Radiance HDR are the only formats the content holds, so
# the codec set is named here instead of taking image's defaults. The defaults
# also carry the avif chain (ravif -> rav1e) whose licence the deny gate fights,
# and every codec lands in the browser wasm; the page loads PNG and JPEG kit
# textures and HDR skies only.
image = { workspace = true, optional = true, default-features = false, features = ["png", "jpeg", "hdr"] }
# The rig cook writes the document's JSON back, so the cooked body keeps the
# rig it came from.
serde_json = { workspace = true, optional = true }

[[example]]
name = "ct35_lod_bake"
required-features = ["import"]

# The compact fighter rig: the atlas becomes KTX2 block maps and the body
# drops its images, so the page can hold the rig it fetches.
[[bin]]
name = "rig_cook"
required-features = ["import"]

# The arena kit bundle: reads the kit glTFs (gltf) and the CC0 JPG sets
# (image), then writes the packed E2BUNDLE of compact glTF plus KTX2 or the
# cooked E204BNDL, so both features.
[[bin]]
name = "arena_bundle"
required-features = ["import", "registry"]

[dev-dependencies]
# The zero-allocation allocator the decode proof installs (feature `test-util`).
engine-core = { workspace = true, features = ["test-util"] }
# VR2: the KTX2 size test measures the cook against PNG of the same texels, so
# the codec rides the test target and never the headless default build.
image = { workspace = true, default-features = false, features = ["png"] }

