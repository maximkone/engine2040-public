[package]
name = "engine-workspace-hack"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[lints]
workspace = true
[dependencies]
# Feature union for externals only (cargo-hakari pattern): one copy per -p test.
# No local engine deps here: every path edge needs a documented audit edge, and
# enabling engine features (import/v1/json/spine) pulls optional externals into
# the headless default graph, which must stay std-only.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
image = { version = "0.25", default-features = false, features = ["png", "hdr", "jpeg"] }
