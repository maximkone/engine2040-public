[package]
name = "engine-game"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Only the two [[bin]] entries below are targets: src/bin/arena_capture.rs is a helper module of
# the arena bin, and autodiscovery would build it a second time with every helper unused.
autobins = false

[lints]
workspace = true

[features]
# Presentation leg: windowed play (render window + device audio Able to be
# enabled). The headless default stays std-only; shipped play uses `app`.
# `app` intentionally does NOT enable `engine-arena/sim`: both legs run the
# same kinematic AR2 match (locomotion + combat + brains), so headless
# checkpoints replay exactly under the window.
#
# RZ4: `app` also turns on the float physical layer (`engine-physfx/rapier`) that
# paints breaks as debris. It only paints: the sim never reads it, and
# `engine-arena`, `engine-combat` and `engine-proof` never name it.
app = ["engine-render/window", "engine-audio/device", "dep:winit", "engine-assets/import", "dep:gilrs", "dep:engine-physfx", "engine-physfx/rapier", "shader-validate", "dep:engine-perf"]

# CQ23: the hot-reload cook checks every edited `.wgsl` with naga (CPU, no
# GPU) instead of brace balance alone; a type-broken edit is refused with its
# line:col and the live generation keeps last-good. Rides `app`; the headless
# default graph stays std-only (no naga in it).
shader-validate = ["engine-render/shader-validate"]

# WIN1: the `arena` window binary, gated on `app` so the headless default
# stays std-only. winit is already wired (MIT/Apache, window stack).
[[bin]]
name = "arena"
path = "src/bin/arena.rs"
required-features = ["app"]

# WIN6: the staged fight frames are drawn by the app-leg raster (windowed), so
# the CT15 receipt binary builds with `--features app`.
[[bin]]
name = "staged_fight"
path = "src/bin/staged_fight.rs"
required-features = ["app"]

[dependencies]
# Workspace-form path deps (orchestrator-normalized from the MV1-packet path
# form; versions centralized in the root table). No unconditional external
# dependency: every crate below is std-only on its default features.
engine-arena.workspace = true
# WEB6: the kit loads through the assets seam (a file source natively, a
# fetched bundle in the browser) and the game holds its assets by generational
# handle, so the seam is a plain dependency. Default features keep the
# headless graph std-only (no `gltf`, no `image`); the `app` leg turns on
# `import` for the real glTF importer.
engine-assets = { workspace = true }
# RZ4 break look: debris bodies from authority break events, `app` leg only
# (physfx is itself behind its own `rapier` feature, so the headless graph stays std-only).
engine-physfx = { workspace = true, optional = true }
engine-clock.workspace = true
engine-input.workspace = true
engine-save.workspace = true
engine-ui.workspace = true
engine-audio.workspace = true
engine-render.workspace = true
# Read-only consumers of lower-lane event/pose types: combat `FightEvent` maps
# 1:1 into audio `FightCue` (the shape crowd.rs documents for GM1) and backs
# exact hp accounting; anim `LocalPose`/`RootTable` carry the LOC2 movement
# path for presentation. Authority stays in arena: game never steps combat or
# physics itself, and never depends on engine-physics directly.
engine-combat.workspace = true
engine-anim.workspace = true
# SL1: practice rules snapshots read HR4 curve schemas (consts + error type
# only; validation runs through these canonical items, never copies).
engine-ai.workspace = true
# GM2 LAN multiplayer: server-authoritative session, client prediction with
# rollback/resimulate, versioned wire codec and redundancy windows are reused
# from engine-net (never reimplemented here). std::net only, so the headless
# default stays std-only; networking joins the headless leg, not the `app` leg.
engine-net.workspace = true
# WD10 siege ballistics: Fixed Q16 flight math from core plus bonded/spread/
# budget walls from destruction (consumed, never mirrored).
engine-core.workspace = true
engine-destruction.workspace = true
# PQ18: the arena window loop stages its input-to-present stamps through the
# perf crate's public latency API (`WindowLatencyLog`, `GpuConditions`). The
# perf crate is a leaf harness (nothing it composes depends on game), so the
# edge stays acyclic; `app` only, so the headless default graph is unchanged.
engine-perf = { path = "../perf", version = "0.1.0", optional = true }
# WD6 mode framework: district cell window over the WD1 CellCoord range
# (consumed, never mirrored).
engine-world.workspace = true
# Hero-framing rank owner: the auto director picks its presented focus
# through `engine-spatial::compose::best_shot` (advisory totals in, shot id
# out), never a local re-derivation. Spatial stays std-only, so the headless
# default graph is unchanged and the edge is acyclic.
engine-spatial.workspace = true
# SHOW1: per-frame SHA-256 for capture manifests (tamper binding the stitch
# validator cross-checks; no hand-rolled crypto).
sha2 = { version = "0.10" }
# E63: the `GameConfig` JSON Schema contract behind the strict layered extract.
# MIT (LICENSE read live 2026-10-20, GREsau/schemars); derive + std are its
# defaults, and both are already in the lock through rmcp.
schemars = { version = "1.2" }
winit = { workspace = true, optional = true }
# Pad device poll on the windowed leg only (optional, so the headless default
# graph stays std-only); Apache-2.0/MIT passes the deny allow-list.
gilrs = { version = "=0.11.2", optional = true }

[dev-dependencies]
# Zero-allocation probe owner: the unit tests' counting allocator.
engine-core = { workspace = true, features = ["test-util"] }
