[package]
name = "engine-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Headless-first: default build pulls zero external deps. `v1` (glam camera
# math + image PNG capture + manifest JSON) and `gpu` (the wgpu lane, implies
# `v1` because `v1_gpu` renders the `v1` scene) are opt-in. image is
# PNG-only (no defaults): the avif chain (ravif/rav1e/libfuzzer-sys, NCSA)
# fails the license gate. serde_json rides `v1`, never dev-deps: the audit
# traverses dev-deps of reachable crates, so no reachable crate takes an
# external dev-dep.
v1 = ["dep:glam", "dep:image", "dep:serde_json", "dep:engine-assets"]
# WEB5: the GPU lane builds for wasm32. pollster compiles there and every
# sync adapter/device helper is native-only; the browser page opens its
# device itself and hands it to `Presenter::init_from_device`, and the
# async-init landing takes the last blocking waits out of that path.
gpu = ["dep:wgpu", "dep:pollster", "dep:engine-material", "v1"]
# The native window lane: the event loop (winit) plus the DXGI VRAM reader
# (the Windows-only `windows` crate) on top of `gpu`.
window = ["gpu", "dep:winit", "dep:windows"]
# CQ23: CPU naga gate over every shipped WGSL, no GPU. Reuses the material
# crate's one naga owner (`engine-material/validate`); the default graph stays
# std-only. `engine-game`'s `app` leg turns this on, so a type-broken shader
# edit is refused with line:col and the live generation keeps last-good.
shader-validate = ["dep:engine-material", "engine-material/validate"]

[[bin]]
name = "kam1a"
path = "src/bin/kam1a.rs"
required-features = ["window"]

[[bin]]
name = "kam1b"
path = "src/bin/kam1b.rs"
required-features = ["window"]

[[bin]]
name = "kam1c"
path = "src/bin/kam1c.rs"
required-features = ["window"]

# The WebGPU conformance gate runner (HX4): one case per process, so a driver
# abort in one case never takes the run with it. The strict instance comes
# from the render stack's own maker, so the flag cannot be forgotten.
[[bin]]
name = "webgpu_cts"
path = "src/bin/webgpu_cts.rs"
required-features = ["window"]

[dependencies]
# HUD command lane owner (UIX13): the hud pass draws `engine-ui` frames. Std-only.
engine-ui.workspace = true
# AH2 device-loss heal runs through the observe supervisor (both std-only
# on the default graph; wgpu stays behind `window`).
engine-observe.workspace = true
# Hash constants (FNV offset/prime, golden gamma): engine-core is the one
# hash owner, the streaming digests name its constants (same values).
engine-core.workspace = true
# The one wall clock (std-only): `std::time::Instant::now` traps in a browser tab, so the
# frame-path timers read this and the web shell installs the page's `performance.now()` into it.
engine-clock.workspace = true
# v1-only tangent owner (ARCHITECTURE C3): v1 calls import_repair::recompute_tangents; default stays std-only.
engine-assets = { workspace = true, features = ["import"], optional = true }
glam = { workspace = true, optional = true }
# NS31c2: the window leg builds one pipeline per compiled material structure
# (`material_pipeline::pipeline_for`); the default graph stays std-only.
engine-material = { workspace = true, optional = true }
# Fully specified (not workspace-inherited): cargo ignores default-features
# = false combined with `workspace = true`, which would re-enable image
# defaults incl. the NCSA-licensed avif chain. Keep version in sync with the
# workspace `image` entry. `jpeg` decodes the CC0 2k arena albedo sets
# (zune-jpeg is already in Cargo.lock through the workspace `image`).
image = { version = "0.25", default-features = false, features = ["png", "hdr", "jpeg"], optional = true }
serde_json = { version = "1", optional = true }
winit = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# `backend::read_vram`: DXGI video-memory budget and usage. The same crate
# version and features already ride in through wgpu-hal's DX12 backend, so
# this adds no new package to the graph; gated behind `window`.
# `power::read_power` (GS40) adds the one `GetSystemPowerStatus` call.
windows = { version = "0.62", optional = true, default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Power"] }

[dev-dependencies]
engine-core = { workspace = true, features = ["test-util"] }
# ENG20 pair capture: writes the TAA-off reference and the TAA-on arms as
# PNG sequences (png only, same crate as the optional `v1` dep). Files land
# under target/captures/taa-pair, never in git.
image = { version = "0.25", default-features = false, features = ["png"] }
