[package]
name = "engine-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
engine-core.workspace = true
engine-input.workspace = true
engine-anim.workspace = true
engine-combat.workspace = true
engine-ai.workspace = true
engine-destruction.workspace = true
# UW12/UW40: the layered navmesh the arena floor is baked into
# (`arena::nav_layers`), one walkable layer per column.
engine-nav.workspace = true
# Std-only by default: EG20 integer fighter collision reuses `controller2`.
# The Rapier settling track lives behind `sim` (AR2-fix): `sim` turns on
# `engine-physics/rapier` for gravity settling plus wall collision.
engine-physics.workspace = true
# ARC3/ARC4: the spine step and parity harness (`spine` flag, a default feature
# since ARC7 so every consumer compiles the migration path).
engine-ecs = { workspace = true, optional = true }

[features]
# ARC7: the spine is the default build of the crate; the flag stays named so
# `--no-default-features` still builds the bare crate. Off only removes the
# modules: `run` and `LiveMatch` step the legacy `Sim` either way.
default = ["spine"]
sim = ["engine-physics/rapier"]
spine = ["dep:engine-ecs"]

[dev-dependencies]
# Zero-allocation probe owner for tests (CODELAW 15); SL27R3 recorder:910.
engine-core = { workspace = true, features = ["test-util"] }
# AL1: the mock provider adapter drives the stamped-reply test. engine-provider
# depends on engine-core only, so this dev edge closes no cycle.
engine-provider.workspace = true

[[bench]]
name = "headless_ticks"
harness = false
