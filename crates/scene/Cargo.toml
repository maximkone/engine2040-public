[package]
name = "engine-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
engine-core.workspace = true
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, optional = true }
uuid = { version = "1", features = ["serde", "v4"] }

# A browser has no OS random source: uuid v4 reads crypto.getRandomValues through `js`.
# Only the real browser target gets it, so native and wasi builds stay as they were.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
serde_json = "1"

# NJ1 authored-file lane: canonical JSON for provenance, opt-in.
[features]
json = ["dep:serde_json"]
