[package]
name = "engine-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
engine-core.workspace = true
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true, optional = true }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"

# N1 math lane: reserved name (unused dep removed).
# NJ1 authored-file lane: canonical JSON for provenance, opt-in.
[features]
math = []
json = ["dep:serde_json"]
