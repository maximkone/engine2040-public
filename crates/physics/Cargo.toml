[package]
name = "engine-physics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# NP1 physics lane: Rapier adapter, opt-in so headless stays std-only.
# enhanced-determinism only: no SIMD/parallel features.
# PH3: engine-anim is opt-in with rapier so the default build stays std-only;
# the ragdoll consumes C4 Skeleton/LocalPose types only (never arena/combat).
[features]
rapier = ["dep:rapier3d", "dep:engine-anim"]

[dependencies]
engine-core = { workspace = true }
# PX15: the persistent lane pool the parallel island step queues on.
engine-ecs = { workspace = true }
# RL58: the debug-render pipeline turns collider and joint outlines into lines;
# a feature only, no solver change and no new dependency.
rapier3d = { workspace = true, optional = true, features = ["debug-render"] }
engine-anim = { workspace = true, optional = true }

[dev-dependencies]
# Zero-allocation probe owner for tests; the release budget leg measures casts.
engine-core = { workspace = true, features = ["test-util"] }
