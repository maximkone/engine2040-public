# engine2040 game project (siege stub). `engine2040 run` and `engine2040 build` read this file
# from the current directory (or from --manifest <path>). Flat `key = value` lines; no [tables].
#
# A key the engine cannot honor is refused by name at `run` and `build`, never ignored:
# quality, gore, physics_layers and content are not wired yet.

# Project name: a-z, 0-9, '-' and '_'. `engine2040 new` fills it from the directory name.
name = "{{name}}"

# Where the game builds: "windows", "web", or both.
targets = ["windows", "web"]

# The game this project builds and runs: "<workspace package>:<bin>". Left out, `build` makes
# the engine's own arena and `run` plays the proof fixture. For the windowed arena:
# game = "engine-game:arena"

# The seed of the headless run: a file holding one unsigned number.
seed_file = "content/seed.txt"
