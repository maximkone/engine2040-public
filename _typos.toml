# _typos.toml - spell-check allowlist for board IDs + tool notes.
# PORT attributions (CODELAW 9, MIT only, shape reuse, no copied code):
# - Boshen/cargo-shear MIT - CI shape cargo shear --deny warnings (ci.yml:36,39).
# - crate-ci/typos MIT - config shape [default.extend-words] + _typos.toml at root.
# Tool notes:
# - typos: run typos --deny-warnings; board IDs stay allowlisted, real typos still fail.
# - cargo-shear: run cargo install cargo-shear then cargo shear --deny warnings (-D warnings); keep deps used.
# Closes board-commit-carried-code class: board IDs in commits/comments never flag as typos.
[default]
extend-ignore-re = ["\\b[A-Z]{1,4}[0-9]{1,3}[a-z]?\\b"]

