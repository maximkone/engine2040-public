# Proof profile for `node tools/proof.mjs` (STEAL-speed OPT6).
# Discipline adapted from the nextest-rs/nextest repo profile shape
# (.config/nextest.toml at pinned commit d643f89, 2026-10-01, MIT;
# reimplemented here, no donor bytes): fail-fast off so one failure never
# hides the next, slow-timeout with terminate-after so a hung leg names
# itself, bounded fixed-backoff retries (count 2, delay 2s) scoped to the
# proof profile only so a planted flaky passes after at most 2 retries and
# still prints `<n> retried` (never silent), and junit receipts per profile
# for the lane log. A partitioned run splits the suite without dropping a
# test: `cargo nextest run --profile proof --partition count:1/2` then
# `count:2/2`. Nextest writes ONE receipt per run: the `path` below rides
# inside the profile store dir, so the proof profile's file lands at
# `target/nextest/proof/target/nextest-junit/proof.xml` and the next run
# replaces it (no per-partition files, nothing is merged). The lane names the
# file the run wrote, found by the run id nextest prints.
# Flaky loopback-socket/timing legs quarantine via the E12 list in
# tools/proof.mjs plus tools/flaky-quarantine.mjs (threshold 2, fail-closed)
# and run under --perf.
# Kept only if faster with the same failures visible
# (OPT6 accept: flake counts before/after ride the proof log).

[profile.proof]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.proof.retries]
backoff = "fixed"
count = 2
delay = "2s"

[profile.proof.junit]
path = "target/nextest-junit/proof.xml"
store-success-output = true
store-failure-output = true

# HX12: the CI publishes a structured test report, so a run's result is read
# without opening the log. The `ci` profile adds a JUnit receipt to the run
# and nothing else (it inherits the default profile, so the CI keeps the same
# fail-fast and retry behaviour). Skipped tests are reported too, so the
# receipt counts every test the run printed. `tools/ctrf-report.mjs` turns
# the receipt into the CTRF 0.2.0 JSON shape.
[profile.ci.junit]
path = "target/nextest-junit/ci.xml"
store-success-output = false
store-failure-output = true
report-skipped = "all"
