name: pages

# WEB10: the browser build on a URL the work PC opens (owner 2026-10-17: public is fine). Builds crates/web for
# wasm32-unknown-unknown exactly like web-build.yml, then deploys the site to GitHub Pages from the Actions flow.
# Runs on every push of the public mirror's main (each snapshot export) and on demand; the private dev repo never
# runs it. GitHub Pages cannot set COOP/COEP headers; WEB14's coi-serviceworker.js adds them from a service worker and
# the page reloads once, so crossOriginIsolated can be true. The Rust build still runs one thread. The page prints the commit and the golden hash; a wrong MIME for the module is checked
# here before anything is published.
# DOC1: the site is three parts under one URL. The game (dist/web) is the root; the handbook (docs/book, built by
# mdBook) is /docs/; rustdoc for the crates a game author touches is /docs/api/. A broken internal link in the book
# (tools/book-links.mjs, run on the sources and on the assembled site) fails the build, and the job summary prints
# the handbook page count, the rustdoc crate list and the rustdoc warning count. The deploy job runs on the default
# branch only, so a throwaway branch can run the whole build to prove a step without publishing.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # a throttled cache (GitHub cache egress over the account limit, 2026-10-21) compiles uncached instead of failing
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CACHE_SIZE: "5G"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    if: github.repository == 'maximkone/engine2040-public'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        # sccache that will not start (the cache over its egress limit, 2026-10-21) took the whole job down;
        # an empty RUSTC_WRAPPER makes cargo compile uncached instead.
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: install repository toolchain (rust-toolchain.toml) and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-build
      - name: wasm-bindgen CLI at the version Cargo.lock locks
        shell: bash
        run: |
          set -euo pipefail
          v="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, "", $0); print; exit }' Cargo.lock)"
          echo "Cargo.lock locks wasm-bindgen $v"
          mkdir -p "$HOME/.local/bin"
          if curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP"; then
            cp "$RUNNER_TEMP/wasm-bindgen-$v-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/"
          else
            cargo install wasm-bindgen-cli --version "$v" --locked --root "$HOME/.local"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Pinned: the apt package is binaryen 108, whose output the browser rejects (see web-build.yml).
      - name: wasm-opt (binaryen release)
        shell: bash
        env:
          BINARYEN_TAG: version_133
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_TAG/binaryen-$BINARYEN_TAG-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/binaryen-$BINARYEN_TAG/bin/wasm-opt" "$HOME/.local/bin/"
          wasm-opt --version
      - name: build dist/web
        shell: bash
        run: |
          set -euo pipefail
          node tools/web-build.mjs --commit "${GITHUB_SHA::12}"
          ls -l dist/web
          {
            echo '### dist/web'
            echo '```json'
            cat dist/web/build.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the module is typed application/wasm by a static server (the page shows a fatal reason for any other type, QW3)
        shell: bash
        run: |
          set -euo pipefail
          wasm="$(node -p "require('./dist/web/build.json').pin['engine_bg.wasm'].name")"
          python3 -m http.server 8099 --bind 127.0.0.1 -d dist/web >/dev/null 2>&1 &
          server=$!
          sleep 2
          type="$(curl -sI "http://127.0.0.1:8099/$wasm" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" { print $2 }')"
          kill "$server"
          echo "$wasm is served as: $type"
          test "$type" = "application/wasm"
      # TG10 (2026-10-24): eight of the crates this job documents are clean, each measured with
      # `cargo doc -p <crate> --no-deps --locked` (physfx with `--features rapier`): engine-core 2 -> 0,
      # engine-input 2 -> 0, engine-physfx 4 -> 0, engine-arena 21 -> 0, engine-net 108 -> 0,
      # engine-combat 48 -> 0, engine-physics 82 -> 0, engine-render 154 -> 0. This gate runs early and on its own so a regressed
      # crate fails by itself, whatever the handbook or the rest of the list does. Add a crate here only
      # after its measured count reaches 0.
      - name: rustdoc gate - the crates that are clean
        shell: bash
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo doc --no-deps --lib --locked -p engine-core -p engine-input -p engine-arena -p engine-net -p engine-combat -p engine-physics -p engine-physfx -p engine-render --features engine-physfx/rapier
      # DOC1: mdBook, pinned to one release and checked against the digest GitHub lists for the asset.
      - name: mdBook (pinned release binary)
        shell: bash
        env:
          MDBOOK_TAG: v0.5.4
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_TAG/mdbook-$MDBOOK_TAG-x86_64-unknown-linux-gnu.tar.gz"
          echo "$MDBOOK_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mdbook" --version
      - name: handbook sources - links, generated door reference
        shell: bash
        run: |
          set -euo pipefail
          node tools/book-links.mjs
          node tools/door-reference.mjs --check
      - name: site - game at the root, handbook under docs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r dist/web/. site/
          mdbook build docs/book --dest-dir "$GITHUB_WORKSPACE/site/docs"
          node tools/book-links.mjs --landing site/index.html
          # llms.txt at the site root: its repository paths become links to the mirror's files.
          sed -E 's#\]\(([^):]+)\)#](https://github.com/maximkone/engine2040-public/blob/main/\1)#g' llms.txt > site/llms.txt
      # The crates a game author touches (tools/book-links.mjs DOC_CRATES, listed on docs/book/api.md). The features
      # are the ones that show the public API: Rapier in physics and physfx, the MCP door in endpoint.
      # TG10 (2026-10-23): `RUSTDOCFLAGS: ""` is deliberate until the count below is zero, so `-D warnings` cannot
      # be turned on yet. Measured on run 40006304627 (success): 781 rustdoc warnings over these 12 crates —
      # engine-render 149, engine-anim 131, engine-game 112, engine-net 108, engine-physics 86, engine-endpoint 75,
      # engine-combat 48, engine-assets 43, engine-arena 21, engine-physfx 4, engine-core 2, engine-input 2.
      # Re-measure the total with this exact step and the `rustdoc warnings:` line it prints; turn the flag on the
      # day that line reads 0.
      # TG10 (2026-10-24): eight of those crates are clean and gated above (engine-core 2 -> 0,
      # engine-input 2 -> 0, engine-physfx 4 -> 0, engine-arena 21 -> 0, engine-net 108 -> 0,
      # engine-combat 48 -> 0, engine-physics 82 -> 0, engine-render 154 -> 0). The remaining four measured 785 on run 40056976625
      # over eight, which drops to 379 by that run's own per-crate numbers: engine-anim 132,
      # engine-game 119, engine-endpoint 82, engine-assets 46.
      - name: rustdoc for the crates a game author touches
        shell: bash
        env:
          RUSTDOCFLAGS: ""
        run: |
          set -euo pipefail
          cargo doc --no-deps --lib --locked -p engine-core -p engine-arena -p engine-combat -p engine-physics -p engine-physfx -p engine-anim -p engine-render -p engine-game -p engine-net -p engine-assets -p engine-input -p engine-endpoint --features engine-physics/rapier,engine-physfx/rapier,engine-endpoint/mcp 2>&1 | tee "$RUNNER_TEMP/rustdoc.log"
          mkdir -p site/docs/api
          cp -r target/doc/. site/docs/api/
          rm -f site/docs/api/.lock
          # rustdoc writes no page for the folder itself: send /docs/api/ to the handbook's API page.
          test -f site/docs/api/index.html || printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../api.html"><title>API reference</title><a href="../api.html">API reference</a>' > site/docs/api/index.html
          # Only rustdoc's own warnings count (the "(lib doc) generated N warnings" lines), not rustc's.
          warnings="$(grep -E '\(lib doc\) generated [0-9]+ warning' "$RUNNER_TEMP/rustdoc.log" | grep -Eo 'generated [0-9]+' | awk '{ n += $2 } END { print n + 0 }')"
          echo "rustdoc warnings: $warnings"
          echo "RUSTDOC_WARNINGS=$warnings" >> "$GITHUB_ENV"
      - name: site - links, page and crate counts
        shell: bash
        run: |
          set -euo pipefail
          node tools/book-links.mjs --site site
          {
            node tools/book-links.mjs --site site --markdown
            echo
            echo "Rustdoc warnings: $RUSTDOC_WARNINGS"
          } >> "$GITHUB_STEP_SUMMARY"
      # WEB10: the site is public by design, so it holds only what the public list names (tools/web-build.mjs): the game's own
      # files, the handbook and rustdoc under docs/, and llms.txt. Anything else fails the build before the upload.
      - name: the site holds only public files
        shell: bash
        run: node tools/web-build.mjs --check-public site --allow-dir docs/ --allow-file llms.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    if: github.repository == 'maximkone/engine2040-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # QW13: the headers the live site really sends for each file (type, encoding, length), asked with Accept-Encoding br, gzip.
      # A wasm not typed application/wasm fails the deploy; the line `brotli=served|not-served` says whether the brotli numbers of
      # tools/web-budget.json describe what a visitor downloads.
      - name: the published files - real response headers, the module typed application/wasm
        shell: bash
        run: node tools/web-headers.mjs --url "${{ steps.deployment.outputs.page_url }}" --out out/pages-headers.json --retries 6 --wait 10
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pages-headers
          path: out/pages-headers.json
          if-no-files-found: warn
      - name: the published handbook and rustdoc answer 200
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          for path in docs/ docs/for-ai.html docs/door-reference.html docs/api/engine_game/index.html; do
            code=000
            for i in 1 2 3 4 5 6; do
              code="$(curl -s -o /dev/null -w '%{http_code}' "$base$path")"
              if [ "$code" = 200 ]; then break; fi
              sleep 10
            done
            echo "$base$path -> $code"
            test "$code" = 200
          done
