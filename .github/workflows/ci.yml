name: ci

# The public mirror is the build farm (Maxim 2026-10-16): GitHub's free public runners run every
# heavy check in parallel (about 10 jobs at once), so the sprint PC compiles only the crate it is
# editing. The private dev repo never runs this (its free minutes are tiny); it is the mirror's job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # a throttled cache (GitHub cache egress over the account limit, 2026-10-21) compiles uncached instead of failing
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CACHE_SIZE: "5G"
  # sccache cannot cache incremental artifacts, so CI (cold every run)
  # disables them for hit rate. Local dev keeps incremental on; cold commands
  # pass CARGO_INCREMENTAL=0 per command (see docs/SMOOTH-BUILD.md).
  CARGO_INCREMENTAL: "0"
  # CI never reads the line tables the dev profile emits (Bevy-kept pair; steal 2026-10-16).
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  quick:
    # No compile: formatting, boundaries, ratchet, gate-tool tests, dependency policy. Every step
    # runs even if an earlier one failed, so one run names all of its reds.
    if: github.repository == 'maximkone/engine2040-public'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # No compile here, so no target cache: only what cargo-deny reads,
      # the registry index, the downloaded crates and the RustSec DB. The
      # compile jobs cache target + registry through Swatinem/rust-cache.
      - name: cargo registry and advisory DB cache
        if: ${{ !cancelled() }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
          key: ${{ runner.os }}-quick-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-quick-cargo-
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: fmt
        run: cargo fmt --all -- --check
      - name: workspace and dependency boundaries
        if: ${{ !cancelled() }}
        run: node tools/workspace-check.mjs
      # Standing run: the public mirror's quick job only (the private dev repo
      # skips every job). Locally the proof is the same --check line; this step
      # first runs at the next `node tools/public-export.mjs --commit --push`.
      - name: tool inventory (tools/README.md and test mates)
        if: ${{ !cancelled() }}
        run: node tools/tools-index.mjs --check
      - name: doc links (every relative link outside docs/archive)
        if: ${{ !cancelled() }}
        run: node tools/docs-links.mjs
      - name: rust quality ratchet (docs/RUST-QUALITY.md)
        if: ${{ !cancelled() }}
        run: node tools/rust-quality.mjs
      - name: gate tool tests
        if: ${{ !cancelled() }}
        shell: bash
        # Quoted glob: node expands it, not the shell. Node's `**` spans every
        # depth and also no directory at all, so the flat tools/*.test.mjs mates
        # stay in and the nested tools/dcc/blender/verify_op.test.mjs runs too.
        # That test spawns `python` (the image ships python-is-python3); the
        # shim covers a future image that drops the plain name.
        run: |
          command -v python >/dev/null || sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          node --test "tools/**/*.test.mjs"
      - name: install cargo-deny (cached)
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18.7
      - name: dependency policy
        if: ${{ !cancelled() }}
        run: cargo deny check

  test:
    # The workspace test suite in four parallel groups; `rest` is everything the other three do not name.
    if: github.repository == 'maximkone/engine2040-public'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: render
            args: "-p engine-render -p engine-editor -p engine-ui -p engine-material"
          - group: game
            args: "-p engine-game -p engine-playtest -p engine-distill -p engine-arena -p engine-combat"
          - group: net
            args: "-p engine-net -p engine-endpoint -p engine-provider -p engine-proof -p engine-perf"
          - group: rest
            args: "--workspace --exclude engine-render --exclude engine-editor --exclude engine-ui --exclude engine-material --exclude engine-game --exclude engine-playtest --exclude engine-distill --exclude engine-arena --exclude engine-combat --exclude engine-net --exclude engine-endpoint --exclude engine-provider --exclude engine-proof --exclude engine-perf"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Native wgpu instances open in strict WebGPU mode. This runner has no GPU adapter, so GPU tests skip here and it only bites on a runner that has one.
      E2040_STRICT_WEBGPU: "1"
    steps:
      - uses: actions/checkout@v5
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
      - name: install mold linker (Linux only)
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        # sccache that will not start (the cache over its egress limit, 2026-10-21) took the whole job down;
        # an empty RUSTC_WRAPPER makes cargo compile uncached instead.
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-debug
          save-if: ${{ matrix.group == 'rest' }}
      - name: install cargo-nextest (cached)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # HX12: the `ci` profile writes a JUnit receipt next to the run, and the
      # run's own words go to a log, so the report can be checked against what
      # the run printed. `shell: bash` keeps pipefail on: a failed test still
      # fails this step.
      - name: test ${{ matrix.group }}
        shell: bash
        run: |
          mkdir -p target/nextest-junit
          cargo nextest run --locked --all-targets --profile ci ${{ matrix.args }} 2>&1 | tee target/nextest-junit/ci.log
      # The structured test report (CTRF): the run's result is read without
      # opening the log. The receipt is written even when a test fails, so a
      # red run is readable too.
      - name: structured test report (CTRF)
        if: ${{ !cancelled() }}
        shell: bash
        run: node tools/ctrf-report.mjs --log target/nextest-junit/ci.log --out target/reports/ctrf.json
      - name: upload the structured test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: ctrf-report-${{ matrix.group }}
          path: target/reports/ctrf.json
      # The donor renders the report in the job page (ctrf-io/github-test-reporter
      # @v1, MIT). It never decides the job: the gate above already did.
      - name: publish the structured test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: target/reports/ctrf.json
          summary-report: true
          failed-report: true
          exit-on-no-files: false
          exit-on-fail: false
      # The shipped-WGSL gate (CQ23): the render lib validates every
      # crates/render/src/shaders file in its shipped composition, so a
      # type-broken shader fails here, not at cook time on a seat. CPU only.
      - name: shader gate (--features shader-validate)
        if: ${{ !cancelled() && matrix.group == 'render' }}
        run: cargo test --locked -p engine-render --lib --features shader-validate shader_validate
      # The anim SIMD gate (AM14): the parallel crowd eval rides the `simd`
      # feature, so the headless default stays std-only. The feature carries
      # the bit-identical pose proof, so it must run here, not only locally.
      - name: anim SIMD gate (--features simd)
        if: ${{ !cancelled() && matrix.group == 'rest' }}
        run: cargo test --locked -p engine-anim --lib --features simd par

  clippy:
    if: github.repository == 'maximkone/engine2040-public'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
      - name: install mold linker (Linux only)
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        # sccache that will not start (the cache over its egress limit, 2026-10-21) took the whole job down;
        # an empty RUSTC_WRAPPER makes cargo compile uncached instead.
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: featureless build (engine-arena --no-default-features)
        run: |
          cargo clippy --locked -p engine-arena --no-default-features --all-targets -- -D warnings
          echo "PASS featureless: engine-arena"

  release-proof:
    # The shipped shape (the `ship` profile: fat LTO, one codegen unit), the
    # recorded-input replay proofs and the legacy golden run twice. The golden
    # hash is proven under both shapes: here in the shipped one, and in the
    # thin-LTO `release` legs.
    if: github.repository == 'maximkone/engine2040-public'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v5
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
      - name: install mold linker (Linux only)
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        # sccache that will not start (the cache over its egress limit, 2026-10-21) took the whole job down;
        # an empty RUSTC_WRAPPER makes cargo compile uncached instead.
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: build
        run: cargo build --locked --workspace --profile ship
      - name: real seed and recorded-input replay proofs
        if: ${{ !cancelled() }}
        run: node tools/proof.mjs --skip-build
      - name: legacy null fixture (golden and two-run equality)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p engine2040 --locked --profile ship --quiet | tee "$RUNNER_TEMP/null-a.log"
          cargo run -p engine2040 --locked --profile ship --quiet | tee "$RUNNER_TEMP/null-b.log"
          grep -Fx "  ticks=600 final_hash=d57b5c8ae3096614" "$RUNNER_TEMP/null-a.log" > "$RUNNER_TEMP/hash-a"
          grep -Fx "  ticks=600 final_hash=d57b5c8ae3096614" "$RUNNER_TEMP/null-b.log" > "$RUNNER_TEMP/hash-b"
          diff "$RUNNER_TEMP/hash-a" "$RUNNER_TEMP/hash-b"
      - name: upload legacy proof logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: legacy-proof-ubuntu-latest
          path: ${{ runner.temp }}/null-*.log

  window-compile:
    # Windows smoke: window-feature check only; the full suite lives in the test groups.
    if: github.repository == 'maximkone/engine2040-public'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        # sccache that will not start (the cache over its egress limit, 2026-10-21) took the whole job down;
        # an empty RUSTC_WRAPPER makes cargo compile uncached instead.
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # shared-key win-check: check.yml's Windows runs (tools/gh-check.mjs app/window lines) restore this cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: win-check
      - name: compile actual window feature (not GPU execution)
        run: cargo check --locked --workspace --all-targets --features window
      - name: build the app test binaries gh-check sends here (warms the cache)
        run: cargo test --locked -p engine-game --features app --no-run

  arm-golden:
    if: github.repository == 'maximkone/engine2040-public'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        # sccache that will not start (the cache over its egress limit, 2026-10-21) took the whole job down;
        # an empty RUSTC_WRAPPER makes cargo compile uncached instead.
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # ARM runners are the slowest and the only place the golden binary is
      # rebuilt beside x86: cache target + registry across snapshots.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm-golden
      - name: legacy golden on ARM
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p engine2040 --locked --release --quiet | tee "$RUNNER_TEMP/arm.log"
          grep -Fx "  ticks=600 final_hash=d57b5c8ae3096614" "$RUNNER_TEMP/arm.log"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: arm-golden-${{ matrix.os }}
          path: ${{ runner.temp }}/arm.log

  # Real GPU simulation parity still needs a scene-consuming GPU runner.
  # The window-compile job intentionally claims compilation only.
