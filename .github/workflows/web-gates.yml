name: web-gates

# The finished web tools had no standing run: web-build.yml fires only on `web-build-*` throwaway branches and on
# dispatch, so no PR and no master push ever saw them (docs/research/tools-gaps-2026-10-23/README.md, gap 1). This is
# the cheap standing path: one dist/web build, then the page gates. The three-build size sweep and the net duels stay
# in web-build.yml.
#
# Why the build steps are copied rather than reused: the gates read dist/web, so the build has to happen here. The
# wasm-bindgen version is read from Cargo.lock and binaryen is pinned to 133 for the reason web-build.yml records (the
# apt binaryen 108 loses table room and the browser rejects the module). The browser legs install Mesa's software
# Vulkan because Chrome's bundled SwiftShader alone gives an adapter but never presents a frame, so the frame gates
# would read a blank canvas.
#
# Legs that cannot run here, and why:
#   * web-doctor prints the toolchain report but does not gate: it exits 1 on a missing wasmtime, which only the
#     wasip1 probe needs; the tools below need node, wasm-bindgen, wasm-opt and Chrome, and those are installed.
#   * web-input-check runs without --native-tape: comparing the browser tape to the native one needs the input_tape
#     bin (web-build.yml builds and compares it). The line printed here says NOT COMPARED; the browser side still gates.
#   * web-headers measures the deployed site, not this build. It runs on push to main only, report-only, because the
#     Pages deploy of the same push may still be in flight.
# The private dev repo has no runners; the public mirror is the build farm (same rule as ci.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page:
    if: github.repository == 'maximkone/engine2040-public'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: install repository toolchain (rust-toolchain.toml) and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-gates
      - name: unit tests of the web tools
        run: node --test tools/web-build.test.mjs tools/web-loader.test.mjs tools/web-browse.test.mjs tools/web-input-check.test.mjs tools/web-budget.test.mjs tools/web-perf.test.mjs tools/web-headers.test.mjs tools/web-doctor.test.mjs tools/wasm-info.test.mjs
      - name: wasm-bindgen CLI at the version Cargo.lock locks
        shell: bash
        run: |
          set -euo pipefail
          v="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, "", $0); print; exit }' Cargo.lock)"
          echo "Cargo.lock locks wasm-bindgen $v"
          mkdir -p "$HOME/.local/bin"
          if curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$RUNNER_TEMP"; then
            cp "$RUNNER_TEMP/wasm-bindgen-$v-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/"
          else
            echo "no prebuilt CLI for $v; building it"
            cargo install wasm-bindgen-cli --version "$v" --locked --root "$HOME/.local"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wasm-bindgen" --version
      - name: wasm-opt (binaryen 133, the pin web-build.yml explains)
        shell: bash
        env:
          BINARYEN_TAG: version_133
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_TAG/binaryen-$BINARYEN_TAG-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/binaryen-$BINARYEN_TAG/bin/wasm-opt" "$HOME/.local/bin/"
          wasm-opt --version
      - name: web toolchain report, not a gate (wasmtime belongs to the wasip1 probe)
        continue-on-error: true
        run: node tools/web-doctor.mjs
      - name: build dist/web
        shell: bash
        run: |
          set -euo pipefail
          node tools/web-build.mjs --commit "${GITHUB_SHA::12}"
          wasm="$(node -p "require('./dist/web/build.json').pin['engine_bg.wasm'].name")"
          node tools/wasm-info.mjs "dist/web/$wasm"
      - name: dist/web holds only public files
        run: node tools/web-build.mjs --check-public dist/web
      - name: Chrome stable
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y -qq "$RUNNER_TEMP/chrome.deb"
          fi
          google-chrome --version
      - name: Vulkan loader and Mesa software driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers
          ls /usr/share/vulkan/icd.d
      - name: headless Chrome loads dist/web (an adapter is required here)
        shell: bash
        run: node tools/web-browse.mjs --dir dist/web --chrome "$(command -v google-chrome)" --out out/web --require-adapter
      - name: web budgets (size, memory, first frame)
        shell: bash
        run: node tools/web-budget.mjs --dir dist/web --receipt out/web/receipt.json --require-receipt
      - name: static draws replayed versus rebuilt (QW10)
        shell: bash
        run: |
          node tools/web-browse.mjs --dir dist/web --chrome "$(command -v google-chrome)" --out out/web-perf --require-adapter --page-query "bundle=ab&freeze"
          node tools/web-perf.mjs --capture out/web-perf/arena-capture.json
      - name: input and audio on the page (browser side only; the tape comparison stays in web-build.yml)
        shell: bash
        run: node tools/web-input-check.mjs --dir dist/web --chrome "$(command -v google-chrome)" --out out/web-input
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-gates
          path: |
            out/web/arena-capture.png
            out/web/receipt.json
            out/web-perf/arena-capture.json
          if-no-files-found: warn

  # What the deployed server really sends. It measures the live Pages site, not this build, so it is report-only and
  # runs on push to main only: a fresh deploy on the same push may still be in flight for the first few tries.
  headers:
    if: github.repository == 'maximkone/engine2040-public' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: the live site types the module as application/wasm
        run: node tools/web-headers.mjs --url https://maximkone.github.io/engine2040-public/ --retries 4
