name: differential

# The ship differential: the reference build and the candidate build play the
# same curated scenario list and every receipt line is diffed. A build that
# changed behaviour shows up as a divergence; a build that only moved its
# clock, or that ran on another machine, does not. The tool exits 1 on one
# divergence, so the job fails on it.
#
# The push leg plays the fast tier on every change of the code. The pull
# request leg plays it on a pull request. The manual leg plays any tier and
# names the ref to compare against.
on:
  workflow_dispatch:
    inputs:
      reference:
        description: The ref the candidate is compared against
        required: false
        default: main
      tier:
        description: The scenario tier to play
        required: false
        default: fast
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fixtures/differential/**"
      - ".github/workflows/differential.yml"
  pull_request:
    paths:
      - "crates/**"
      - "fixtures/differential/**"
      - ".github/workflows/differential.yml"

permissions:
  contents: read

# A newer push to the same ref supersedes the older run.
concurrency:
  group: differential-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # a throttled cache (GitHub cache egress over the account limit, 2026-10-21) compiles uncached instead of failing
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # CI never reads the line tables the dev profile emits.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: 0

jobs:
  differential:
    # The public mirror is the build farm; the private dev repo never runs it.
    # A push with no previous commit (the first one on a branch) has no
    # reference to compare against, so the job stands down.
    if: >-
      github.repository == 'maximkone/engine2040-public' &&
      github.event.before != '0000000000000000000000000000000000000000'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TIER: ${{ github.event.inputs.tier || 'fast' }}
      # The deep tier plays binaries that need their own features, so the
      # build asks for them only when the deep tier is the one that runs.
      FEATURES: ${{ github.event.inputs.tier == 'deep' && 'arena,spine,ragdoll' || 'arena' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - uses: actions/checkout@v5
        with:
          path: reference
          # The push leg compares against the commit before the push, the pull
          # request leg against the base of the pull request, and the manual
          # leg against the ref the human names.
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.event.inputs.reference }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: install repository toolchain (rust-toolchain.toml)
        working-directory: candidate
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: differential
          workspaces: |
            candidate -> target
            reference -> target
      - name: build the reference
        working-directory: reference
        run: cargo build --locked --release -p engine-proof --features $env:FEATURES --bins
      - name: build the candidate
        working-directory: candidate
        run: cargo build --locked --release -p engine-proof --features $env:FEATURES --bins
      - name: collect the reference receipt
        working-directory: candidate
        run: >-
          cargo run --locked --release -p engine-proof --bin differential --
          --scenarios fixtures/differential/scenarios.txt
          --tier "$env:TIER"
          --build ../reference/target/release
          --out ../reference.log
      - name: collect the candidate receipt
        working-directory: candidate
        run: >-
          cargo run --locked --release -p engine-proof --bin differential --
          --scenarios fixtures/differential/scenarios.txt
          --tier "$env:TIER"
          --build target/release
          --out ../candidate.log
      # The tool exits 1 on one divergence, so this step fails the job.
      - name: compare the two receipts
        working-directory: candidate
        run: >-
          cargo run --locked --release -p engine-proof --bin differential --
          --reference ../reference.log
          --candidate ../candidate.log
      - name: upload the two receipts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: differential-receipts
          path: |
            reference.log
            candidate.log
