name: check

# GitHub as the workforce (Maxim 2026-10-16): a sprint helper sends one narrow cargo command here with
# tools/gh-check.mjs; the runner builds the helper's working tree (pushed to a throwaway wip-* branch of
# the public mirror) and runs it. Up to 20 run at once, so the PC's one build lock no longer queues them.
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "one cargo check|test|clippy command, or one cargo mutants slice (-p <crate> and --shard k/n or -f <file>)"
        required: true
      os:
        # tools/gh-check.mjs sends lines that need Windows or a window|app|ui|device feature to Windows; the rest to Linux.
        description: "runner"
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, windows-latest]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # a throttled cache (GitHub cache egress over the account limit, 2026-10-21) compiles uncached instead of failing
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_CACHE_SIZE: "5G"
  CARGO_INCREMENTAL: "0"

jobs:
  run:
    if: github.repository == 'maximkone/engine2040-public'
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # In the background: deleting these took 108 s of a 155 s check (run 39613202879, 2026-10-21) while
      # the build itself took 14 s. The delete keeps going beside the compile; the job reaps it at the end.
      - name: free disk
        if: runner.os == 'Linux'
        run: nohup sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost > /dev/null 2>&1 &
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: sccache or plain rustc
        # sccache that will not start (the cache over its egress limit, 2026-10-21) took the whole job down;
        # an empty RUSTC_WRAPPER makes cargo compile uncached instead.
        shell: bash
        run: |
          sccache --start-server > /dev/null 2>&1 || { echo "sccache would not start, compiling uncached"; echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"; }
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # Restore only: main's ci.yml saves these (test-debug on Linux, win-check from its window-compile job on Windows).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'win-check' || 'test-debug' }}
          save-if: "false"
      # AF5 (owner 2026-10-24): a cargo mutants line only. The release is pinned (27.1.0, the one the owner installed on the PC).
      - name: install cargo-mutants (pinned)
        if: startsWith(inputs.cmd, 'cargo mutants ')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # tools/mutants.mjs (the nightly's judge) reads what cargo-mutants wrote, and needs Node 22+.
      - name: node for tools/mutants.mjs
        if: startsWith(inputs.cmd, 'cargo mutants ')
        uses: actions/setup-node@v5
        with:
          node-version: 24
      # A wasm check line needs the target's rust-std, which the image does not ship:
      # runs 40125053939 and 40125845878 died in seconds on E0463 `can't find crate for core`.
      - name: wasm32 target for a wasm check line
        if: contains(inputs.cmd, '--target wasm32-unknown-unknown')
        run: rustup target add wasm32-unknown-unknown
      - name: run the command
        env:
          CMD: ${{ inputs.cmd }}
        shell: bash
        run: |
          case "$CMD" in
            "cargo check "*|"cargo test "*|"cargo clippy "*|"cargo mutants "*) ;;
            *) echo "refused: only cargo check, cargo test, cargo clippy or cargo mutants"; exit 2 ;;
          esac
          case "$CMD" in *'&'*|*';'*|*'|'*|*'`'*|*'$('*|*'>'*|*'<'*) echo "refused: one plain command only"; exit 2 ;; esac
          if [ "${CMD#cargo mutants }" != "$CMD" ]; then
            # one crate and one slice of its mutants, never the whole workspace (gh-check's okCmd says the same)
            case " $CMD " in *" --workspace "*|*" --all "*) echo "refused: cargo mutants never runs the whole workspace"; exit 2 ;; esac
            case " $CMD " in *" -p "*|*" --package "*|*" --package="*) ;; *) echo "refused: cargo mutants needs -p <crate>"; exit 2 ;; esac
            case " $CMD " in *" --shard "*|*" --shard="*|*" -f "*|*" --file "*|*" --file="*) ;; *) echo "refused: cargo mutants needs --shard k/n or -f <file>"; exit 2 ;; esac
            echo "+ $CMD"
            # cargo-mutants exits 0 (all caught), 2 (some missed), 3 (timeouts) or 4 (unmutated baseline failed); the judge reads what it wrote
            bash -c "$CMD" || echo "cargo-mutants exit $? (0 all caught, 2 some missed, 3 timeouts, 4 baseline failed)"
            # the judge: one line per missed mutant, then the counts (caught, missed, unviable, timeout) and RESULT last; exit 0 PASS, 1 FAIL
            node tools/mutants.mjs --from-out mutants.out --max-missed 0
            exit $?
          fi
          echo "+ $CMD"
          bash -c "$CMD"
      - name: keep the mutants output (outcomes.json, missed lists, logs)
        if: always() && startsWith(inputs.cmd, 'cargo mutants ')
        uses: actions/upload-artifact@v5
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
          retention-days: 14
