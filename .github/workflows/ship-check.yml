name: ship-check

# HX10 + ENG19: the ship build must be reproducible and it must run. This job
# builds the Windows ship profile twice, each from a clean folder, and compares
# the two file trees by content hash (tools/ship-check.mjs): one hash per file
# and a tree hash over them. Equal tree hashes are the receipt; a mismatch
# names the file that moved. Then it builds the root proof binary with the same
# profile, copies it into the clean folder, starts it there with a sanitized
# environment and checks the run receipt: a missing line, a zero tick or a hash
# that is not the golden fails the job (tools/ship-run.mjs). The shipped arena
# binary also plays ten seconds of game time with `--headless`: no window, no
# event loop, no wgpu adapter, twice from fresh state, and the two final hashes
# must agree. So the job proves the game boots and plays, not only that it
# links. The headless route never asks for an adapter; the receipt names the
# skipped presenter (`frames=0`) instead of skipping the leg. The public mirror
# is the build farm; the private dev repo never runs this job.
#
# A Windows PE image carries two fields the linker writes fresh in every
# build: the COFF time stamp and the CodeView debug record (the PDB GUID and
# its age). The tool hashes a PE image with those fields zeroed and leaves
# the PDB out of the tree, naming it in the receipt: the PDB is debug data
# and it is not part of the shipped bundle. Every other byte is compared as
# it is, so the code, the imports and the data must match.
on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref does not supersede this job. Two cold fat-LTO
# builds take longer than the gap between two pushes to the mirror, so a job
# that a newer push cancels would never finish and the check would never
# prove anything. The job reads the commit it was started on, so an old run
# still says something true.
concurrency:
  group: ship-check-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # A cold build every time: nothing to reuse, so the two builds are equal
  # only when the compiler is.
  CARGO_INCREMENTAL: "0"

jobs:
  reproducible:
    # The shipped Windows artifact is the arena binary, built with the `ship`
    # profile (fat LTO, one codegen unit; Cargo.toml [profile.ship], the same
    # profile tools/ship.mjs packs and the CI release-proof leg builds).
    if: github.repository == 'maximkone/engine2040-public'
    runs-on: windows-latest
    # Two cold fat-LTO Windows builds of the arena, the small proof build and
    # the headless runs: 45 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: install repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: prove the receipt checker refuses a broken receipt
        # The same checker the run step uses; a good receipt passes, a wrong
        # hash or a zero tick is red by name. Cheap, so it runs before the
        # cold builds and its failures are visible at once.
        run: node --test tools/ship-check.test.mjs tools/ship-run.test.mjs
      - name: build the ship profile twice from a clean folder
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'ship-target'
          $env:CARGO_TARGET_DIR = $target
          # MSVC's link.exe writes the wall clock into the PE header; /Brepro
          # turns it into a hash of the content, so the raw artifact carries no
          # clock. The link still writes a fresh debug GUID into the image, so
          # the comparison zeroes that field (and the time stamp) before it
          # hashes: tools/ship-check.mjs does that. The remap keeps the source
          # and the cargo-home paths out of the binary (the flags tools/ship.mjs
          # uses for the packaged artifact).
          $env:RUSTFLAGS = "-Clink-arg=/Brepro --remap-path-prefix=$env:GITHUB_WORKSPACE=. --remap-path-prefix=$env:USERPROFILE\.cargo=./cargo-home"
          New-Item -ItemType Directory -Force -Path target/ship-check/ship-a, target/ship-check/ship-b | Out-Null
          New-Item -ItemType File -Force -Path target/ship-check/ship-hashes.txt | Out-Null
          cargo build --locked --profile ship -p engine-game --features app
          if ($LASTEXITCODE -ne 0) { throw 'the first ship build failed' }
          # The tree under test: the files the ship profile wrote (the arena
          # binary and its dep-info). The cargo bookkeeping folders are left
          # out: they hold mtimes, not the build.
          Get-ChildItem -LiteralPath (Join-Path $target 'ship') -File | Copy-Item -Destination target/ship-check/ship-a -Force
          # The second build starts from nothing: the folder is wiped first.
          Remove-Item -LiteralPath $target -Recurse -Force
          cargo build --locked --profile ship -p engine-game --features app
          if ($LASTEXITCODE -ne 0) { throw 'the second ship build failed' }
          Get-ChildItem -LiteralPath (Join-Path $target 'ship') -File | Copy-Item -Destination target/ship-check/ship-b -Force
          Get-ChildItem target/ship-check/ship-a, target/ship-check/ship-b | ForEach-Object { "$($_.Directory.Name)/$($_.Name) $($_.Length) bytes" }
      - name: compare the two trees by content hash
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/ship-check.mjs --print target/ship-check/ship-a > target/ship-check/ship-a.txt
          if ($LASTEXITCODE -ne 0) { throw 'ship-check could not read the first tree' }
          node tools/ship-check.mjs --print target/ship-check/ship-b > target/ship-check/ship-b.txt
          if ($LASTEXITCODE -ne 0) { throw 'ship-check could not read the second tree' }
          $a = (node tools/ship-check.mjs --hash target/ship-check/ship-a | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'ship-check could not hash the first tree' }
          $b = (node tools/ship-check.mjs --hash target/ship-check/ship-b | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'ship-check could not hash the second tree' }
          @(
            'ship-check: the ship profile build, twice, from a clean folder'
            "build a: $a"
            "build b: $b"
            'tree a:'
            (Get-Content target/ship-check/ship-a.txt)
            'tree b:'
            (Get-Content target/ship-check/ship-b.txt)
          ) | Out-File -Encoding utf8 target/ship-check/ship-hashes.txt
          if ($env:GITHUB_STEP_SUMMARY) {
            '```' | Out-File -Append -Encoding utf8 -LiteralPath $env:GITHUB_STEP_SUMMARY
            Get-Content target/ship-check/ship-hashes.txt | Out-File -Append -Encoding utf8 -LiteralPath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding utf8 -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          Get-Content target/ship-check/ship-hashes.txt
          if ($a -ne $b) {
            # The red must say which file moved, so the receipt names it.
            Compare-Object (Get-Content target/ship-check/ship-a.txt) (Get-Content target/ship-check/ship-b.txt) |
              Select-Object -First 20 | Out-String | Write-Output
            "SHIP-CHECK FAIL: the two ship builds differ: a=$a b=$b" |
              Out-File -Append -Encoding utf8 target/ship-check/ship-hashes.txt
            Write-Output "SHIP-CHECK FAIL: the two ship builds differ: a=$a b=$b"
            exit 1
          }
          Write-Output "SHIP-CHECK PASS: the two ship builds have the same tree hash $a"
      - name: run the shipped build and check the receipt
        # The build proof above says the artifact is reproducible; this step
        # says it runs. The root proof binary is built with the same ship
        # profile and the same target folder (so it shares the second build's
        # dependencies) and is copied into the clean folder beside arena.exe.
        # tools/ship-run.mjs starts it there with a sanitized environment,
        # requires `ticks=<n> final_hash=d57b5c8ae3096614` with n > 0, prints
        # `SHIP-RUN tick=<n> hash=<h>`, then plays the shipped arena binary
        # with `--headless` (no window, no adapter) for 600 ticks, twice, and
        # requires one final hash from both runs. A missing receipt, a short
        # run, a missing hash or a moved hash exits the tool and turns the job
        # red. The no-adapter runner presents no frame, so the receipt says
        # `frames=0` and the tool names `adapter=none`; the game itself ran.
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'ship-target'
          $env:CARGO_TARGET_DIR = $target
          $env:RUSTFLAGS = "-Clink-arg=/Brepro --remap-path-prefix=$env:GITHUB_WORKSPACE=. --remap-path-prefix=$env:USERPROFILE\.cargo=./cargo-home"
          cargo build --locked --profile ship -p engine2040
          if ($LASTEXITCODE -ne 0) { throw 'the ship proof binary build failed' }
          $proof = Join-Path $target 'ship/engine2040.exe'
          if (-not (Test-Path -LiteralPath $proof)) { throw "the ship proof binary is missing: $proof" }
          Copy-Item -LiteralPath $proof -Destination target/ship-check/ship-a/engine2040.exe -Force
          node tools/ship-run.mjs --proof target/ship-check/ship-a/engine2040.exe --arena target/ship-check/ship-a/arena.exe --log target/ship-check/ship-run.txt
          if ($LASTEXITCODE -ne 0) { throw 'the shipped build did not prove itself; see target/ship-check/ship-run.txt' }
          if ($env:GITHUB_STEP_SUMMARY) {
            '```' | Out-File -Append -Encoding utf8 -LiteralPath $env:GITHUB_STEP_SUMMARY
            Get-Content target/ship-check/ship-run.txt | Select-String -Pattern '^SHIP-' | ForEach-Object { $_.Line } |
              Out-File -Append -Encoding utf8 -LiteralPath $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding utf8 -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - name: upload the ship-check receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ship-check-hashes
          path: target/ship-check/ship-hashes.txt
          if-no-files-found: error
      - name: upload the ship-run receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ship-run-receipt
          path: target/ship-check/ship-run.txt
          if-no-files-found: ignore
