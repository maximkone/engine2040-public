name: kani

# HS23: 20 Kani harnesses over four integer kernels. Kani is not installed on
# the shared PC, so this job is the Accept's CI leg: install Kani 0.68.0 on a
# hosted Linux runner, run each kernel set by harness name, and print one
# count line. A dispatch on the private repo is explicit; the public mirror
# also runs it on main and on a kani-* branch.
on:
  workflow_dispatch:
  push:
    branches: [main, "kani-*"]

permissions:
  contents: read

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: kani-${{ matrix.kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kernel: [q16, cut, bond, tape]
    steps:
      - uses: actions/checkout@v5
      - name: install the repository toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: cache Kani 0.68.0
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-0.68.0-${{ runner.os }}
      - name: install Kani 0.68.0
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-kani" ] || [ ! -d "$HOME/.kani" ]; then
            cargo install --locked kani-verifier --version 0.68.0
            cargo kani setup
          fi
          cargo kani --version
      - name: verify the ${{ matrix.kernel }} kernel set
        shell: bash
        run: |
          set -uo pipefail
          kernel="${{ matrix.kernel }}"
          log="kani-${kernel}.log"
          cargo kani -p engine-proof --lib --default-unwind 64 --harness "${kernel}::" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          passed=$(grep -c 'VERIFICATION:- SUCCESSFUL' "$log" || true)
          echo "KANI ${kernel}: ${passed}/5 harnesses passed"
          if [ "$code" -ne 0 ] || [ "$passed" -ne 5 ]; then
            exit 1
          fi

  total:
    name: kani-total
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: print the harness count
        shell: bash
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "KANI TOTAL: not all 20 harnesses passed"
            exit 1
          fi
          echo "KANI TOTAL: 20/20 harnesses passed"
